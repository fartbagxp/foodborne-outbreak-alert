name: Foodborne Outbreak nightly update

on:
  push:
    branches:
      - main
  schedule:
    - cron: '45 10 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-scrape every outbreak, ignoring previously-scraped data (default: incremental)'
        type: boolean
        default: false

jobs:
  scrape-outbreaks:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Write access is needed to push changes back to the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 'latest'

      - name: Install Playwright browsers
        run: |
          uv run playwright install --with-deps chromium

      - name: Install flyctl (for the FDA proxy)
        continue-on-error: true # A failure here must not skip CDC/combine/commit below.
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Allocate fly.dev proxy IP
        # The dedicated IPv4 fda-scrape-proxy needs (for raw TCP passthrough — see
        # fly-proxy/README.md) is billed for as long as it's allocated, independent of
        # machine state, so it's allocated fresh for this run and released below rather
        # than left sitting on the app permanently. Release any IP left over from a
        # previous run that failed before its own release step first, so these never
        # accumulate. The new IP is passed directly (not the fda-scrape-proxy.fly.dev
        # hostname) since DNS for it may not have updated yet.
        id: fda-proxy-ip
        continue-on-error: true # A failure here must not skip CDC/combine/commit below; the FDA step already tolerates a missing proxy IP.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PROXY_API_TOKEN }}
        run: |
          for ip in $(flyctl ips list --app fda-scrape-proxy --json | jq -r '.[] | select(.Type=="v4") | .Address'); do
            flyctl ips release "$ip" --app fda-scrape-proxy
          done
          flyctl ips allocate-v4 --app fda-scrape-proxy --yes
          ip=$(flyctl ips list --app fda-scrape-proxy --json | jq -r '.[] | select(.Type=="v4") | .Address')
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Running scrape script on FDA
        continue-on-error: true # Keep the job going even if FDA/the proxy is unreachable.
        env:
          # FDA sits behind Akamai, which blocks GitHub Actions runner IPs
          # inconsistently (the runner IP pool is shared and only part of it
          # is blocklisted at a given time). Routing through this fixed
          # fly.dev egress IP avoids that flakiness — see fly-proxy/README.md.
          FDA_PROXY_SERVER: http://${{ steps.fda-proxy-ip.outputs.ip }}:8888
          FDA_PROXY_USERNAME: ${{ secrets.FDA_PROXY_USERNAME }}
          FDA_PROXY_PASSWORD: ${{ secrets.FDA_PROXY_PASSWORD }}
        run: |
          # Incremental by default: an outbreak already scraped successfully is reused
          # instead of re-fetched once it's >365 days old, since FDA doesn't update old
          # outbreak pages. Trigger manually with "full" checked to force a complete re-scrape.
          uv run python main.py --fda --max-age-days 365 ${{ inputs.full && '--full' || '' }}

      - name: Shut down fly.dev proxy
        # auto_stop_machines in fly-proxy/fly.toml would eventually suspend the machine
        # on its own (~5 min idle), but stopping it explicitly here means it's never
        # running longer than this job actually needs it for. The IP is released for
        # real: unlike the machine, fly bills a dedicated IPv4 for as long as it's
        # allocated, whether or not the machine behind it is running.
        if: always() # Even if the FDA/allocate step above failed, this run may still have live paid resources.
        continue-on-error: true # Don't fail the job over cleanup.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PROXY_API_TOKEN }}
        run: |
          for id in $(flyctl machine list --app fda-scrape-proxy -q); do
            flyctl machine stop "$id" --app fda-scrape-proxy
          done
          for ip in $(flyctl ips list --app fda-scrape-proxy --json | jq -r '.[] | select(.Type=="v4") | .Address'); do
            flyctl ips release "$ip" --app fda-scrape-proxy
          done

      - name: Running scrape script on CDC
        continue-on-error: true # If CDC is down, we don't want the whole job to fail.
        run: |
          # Incremental by default: an investigation already scraped successfully is
          # reused instead of re-fetched once it's closed or >365 days old, since CDC
          # doesn't update old investigation pages. Trigger manually with "full" checked
          # to force a complete re-scrape (e.g. to recover from a bad scrape).
          uv run python main.py --cdc --max-age-days 365 ${{ inputs.full && '--full' || '' }}

      - name: Running scrape script on USDA
        continue-on-error: true # If FSIS is down, we don't want the whole job to fail.
        run: |
          # One API request returns the full FSIS recall history, so there's nothing
          # incremental to do here and --max-age-days/--full don't apply. Writes only
          # data/raw/usda_recalls.json; the cross-links to outbreaks are added by the
          # combine step below.
          uv run python main.py --usda

      - name: Combine sources and cross-link recalls
        continue-on-error: true # If either source failed, this may not work properly
        run: |
          # Rebuilds combined_outbreaks.json (FDA + CDC only) and writes the
          # recall/outbreak cross-links into both that file and usda_recalls.json.
          uv run python main.py --combine

      - name: Summarize using README
        run: |
          uv run python generate_stats.py

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main'
        run: |
          git status
          git config --local user.email "noreply@github.com"
          git config --local user.name "github-actions[bot]"
          git add data/raw/
          git add README.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "Nightly update of raw foodborne outbreak changes - $(date +'%Y-%m-%d')"
            git push -u origin main
          fi

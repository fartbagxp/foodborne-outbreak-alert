# Temporary tinyproxy instance used to test whether routing FDA scraper
# traffic through a fly.dev egress IP avoids the Akamai block on GitHub
# Actions runner IPs. Destroy this app when the test is done:
#   fly apps destroy fda-scrape-proxy
#
# Set secrets before deploying:
#   fly secrets set BASIC_AUTH_USER=<random-user> BASIC_AUTH_PASS=<random-pass>

app = "fda-scrape-proxy"
primary_region = "sjc"

[build]

[[services]]
  internal_port = 8888
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 8888

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

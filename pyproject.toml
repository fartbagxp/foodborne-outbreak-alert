[project]
name = "foodborne-outbreak-alert"
version = "1.0.0"
description = "For searching and collecting Foodborne Outbreak alerts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4==4.15.0",
    "playwright==1.64.1",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
